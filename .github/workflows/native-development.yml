# Development validation only: no deployment, release, device install or main push.
name: Native development validation
on:
  push:
    branches: [feature/0.8-smooth-and-seen]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: native-development-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Host prerequisites and validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -r tools/requirements-dev.txt
          cmake -S . -B build/host -DCMAKE_BUILD_TYPE=Release
          cmake --build build/host --parallel 2
          ctest --test-dir build/host --output-on-failure
      - name: Ensure the requested draft PR exists
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/0.8-smooth-and-seen'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          existing=$(gh pr list --head feature/0.8-smooth-and-seen --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh pr create --draft --base main --head feature/0.8-smooth-and-seen --title 'Miku-FM 0.8: smooth and seen' --body-file docs/PR_0_8_DRAFT.md
          else
            gh pr view "$existing" --json url --jq .url
          fi
      - name: Authentic JieLi toolchain and pinned SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/tools
          git clone https://github.com/zvenson/dinghy.git build/dinghy
          git -C build/dinghy checkout --detach f77bf03283bbb2c05294b01cdad68a30b410f93d
          bash build/dinghy/tools/get_toolchain.sh "$RUNNER_TEMP/jieli"
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$RUNNER_TEMP/ac79-sdk"
          test "$(git -C "$RUNNER_TEMP/ac79-sdk" rev-parse HEAD)" = d179b4484759423312073f5fbb232501aa491047
          echo "JIELI_TOOLCHAIN=$RUNNER_TEMP/jieli/toolchain" >> "$GITHUB_ENV"
          echo "AC79_SDK=$RUNNER_TEMP/ac79-sdk" >> "$GITHUB_ENV"
      - name: Pinned CPU emulator
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/joakimeriksson/fm1-emu.git build/fm1-emu-src
          git -C build/fm1-emu-src checkout --detach 9de1ef053a3c4bf56f16f05b5f0de193f4608a1d
          rustup toolchain install 1.99.1 --profile minimal
          cargo +1.99.1 build --locked --release --manifest-path build/fm1-emu-src/Cargo.toml -p fm1-emu
      - name: Instrumented v0.7 playback baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/baseline-0.7 build/evidence/0.8-ci
          git archive v0.7 | tar -x -C build/baseline-0.7
          python3 tools/instrument_playback_baseline.py build/baseline-0.7
          bash build/baseline-0.7/native/build.sh 2>&1 | tee build/evidence/0.8-ci/baseline-build.log
          for page in stage dance; do
            python3 tools/playback_emu_profile.py --emu build/fm1-emu-src/target/release/fm1-emu --package build/baseline-0.7/build/native/miku-fm.fwsc --symbols build/baseline-0.7/build/native/miku-fm-symbols.txt --page "$page" --allow-overruns --out "build/evidence/0.8-ci/$page-baseline"
          done
      - name: Native profiles, budgets, USB integration and emulator smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/evidence/0.8-ci
          bash native/build.sh 2>&1 | tee build/evidence/0.8-ci/default-build.log
          bash tools/emu_smoke.sh build/native/miku-fm.fwsc build/evidence/0.8-ci/default-smoke "$PWD/build/fm1-emu-src/target/release/fm1-emu"
          bash native/build.sh --video 2>&1 | tee build/evidence/0.8-ci/video-build.log
          bash tools/emu_smoke.sh build/native/miku-fm-video.fwsc build/evidence/0.8-ci/video-smoke "$PWD/build/fm1-emu-src/target/release/fm1-emu"
          python3 tests/test_native_video.py build/dinghy
          for page in stage dance; do
            python3 tools/playback_emu_profile.py --emu build/fm1-emu-src/target/release/fm1-emu --package build/native/miku-fm.fwsc --symbols build/native/miku-fm-symbols.txt --page "$page" --out "build/evidence/0.8-ci/$page-default"
          done
          bash native/build.sh --video-bench 2>&1 | tee build/evidence/0.8-ci/video-bench-build.log
          python3 tools/video_emu_bench.py --emu build/fm1-emu-src/target/release/fm1-emu --out build/evidence/0.8-ci/jpeg-bench
          python3 tools/video_bench_report.py build/evidence/0.8-ci/jpeg-bench
          cp build/native/*resources.json build/evidence/0.8-ci/
      - name: Retain development packages and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-development-${{ github.sha }}
          path: |
            build/evidence/0.8-ci/
            build/native/
          if-no-files-found: warn
