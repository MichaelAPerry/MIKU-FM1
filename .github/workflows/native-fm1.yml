name: Native FM1
on:
  workflow_dispatch:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/native-fm1.yml'
jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Install JieLi Linux compiler
        run: |
          mkdir -p "$HOME/.jieli"
          curl -fsSL --retry 3 https://pkgman.jieliapp.com/s/linux-toolchain | tar -xJ -C "$HOME/.jieli"
          TC="$(find "$HOME/.jieli" -maxdepth 1 -type d -name 'jieli-linux-toolchains-*' | sort | tail -1)"
          test -n "$TC"
          ln -s "$TC" "$HOME/.jieli/toolchain"
      - name: Get pinned AC79 SDK
        run: git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"
      - name: Build native application
        env:
          DINGHY_COMMIT: 22acb9165ebc8baa712af3aff8c507e230c1e028
        run: bash native/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-miku-fm1-fwsc
          path: build/native/miku-fm1.fwsc
