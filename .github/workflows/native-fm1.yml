name: Native FM1
on:
  workflow_dispatch:
  push:
    paths:
      - 'native/**'
      - 'site/**'
      - '.github/workflows/native-fm1.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Install JieLi Linux compiler
        run: |
          mkdir -p "$HOME/.jieli"
          curl -fsSL --retry 3 https://pkgman.jieliapp.com/s/linux-toolchain | tar -xJ -C "$HOME/.jieli"
          TC="$(find "$HOME/.jieli" -maxdepth 1 -type d -name 'jieli-linux-toolchains-*' | sort | tail -1)"
          test -n "$TC"
          ln -s "$TC" "$HOME/.jieli/toolchain"
      - name: Get pinned AC79 SDK
        run: git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"
      - name: Build native application
        env:
          DINGHY_COMMIT: 22acb9165ebc8baa712af3aff8c507e230c1e028
        run: bash native/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-miku-fm1-fwsc
          path: build/native/miku-fm1.fwsc

      - name: Install existing full-system FM-1 emulator
        id: emulator
        uses: dimmkirr/setup-fm1-emulator@v1
        with:
          install-playwright: 'false'
      - name: Boot native firmware in actual FM-1 emulator
        run: |
          mkdir -p build/emulator
          fm1-emu --fwsc build/native/miku-fm1.fwsc --ms 1500 --keys '100:PLAY' --snap 300,1000 --wav build/emulator/audio.wav > build/emulator/boot.log 2>&1
          test -s build/emulator/audio.wav
          python3 - <<'PY'
          import wave, audioop
          with wave.open('build/emulator/audio.wav','rb') as w:
              data=w.readframes(w.getnframes())
              print('Audio frames:',w.getnframes(),'RMS:',audioop.rms(data,w.getsampwidth()))
              assert w.getnframes()>10000, 'short output'
              assert audioop.rms(data,w.getsampwidth())>10, 'firmware audio is silent'
          PY
          # Emulator releases may write snapshots under their working directory.
          find . -type f -name 'lcd_*.bmp' -print -exec cp {} build/emulator/ \; || true
          ls -lh build/emulator/audio.wav
          cat build/emulator/boot.log | tail -50
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miku-emulator-evidence
          path: |
            build/emulator/
            work/lcd_*.bmp

      - name: Build public browser testing site
        if: success()
        env:
          FM1_WEB: ${{ steps.emulator.outputs.web-path }}
        run: |
          mkdir -p build/pages/emulator
          test -s "$FM1_WEB/fm1_web.wasm"
          cp -R "$FM1_WEB/." build/pages/emulator/
          python3 - <<'PY'
          import json
          from pathlib import Path
          catalog = {"default":"miku","firmwares":[{"id":"miku","name":"MIKU-FM1","version":"prototype","author":"MichaelAPerry","license":"GPL-3.0","about":"Native singing synth prototype","repo":"https://github.com/MichaelAPerry/MIKU-FM1","package":"../miku-fm1.fwsc"}]}
          Path("build/pages/emulator/firmwares.json").write_text(json.dumps(catalog))
          PY
          cp build/native/miku-fm1.fwsc build/pages/miku-fm1.fwsc
          cp site/index.html build/pages/index.html
          touch build/pages/.nojekyll
          test -s build/pages/emulator/index.html
          test -s build/pages/miku-fm1.fwsc
      - uses: actions/configure-pages@v5
        if: success()
      - uses: actions/upload-pages-artifact@v3
        if: success()
        with:
          path: build/pages
      - uses: actions/deploy-pages@v4
        if: success()
        id: deployment
