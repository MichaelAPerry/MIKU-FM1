# SPDX-License-Identifier: MIT
# Miku-FM's release, after MPFM1's (fm1-base's template release.yml), built by the shared FM-1 builder
# (zvenson/fm1-build@v1) with signed build provenance: the Firmware Hub shows "Built from source" for these files.
# A tag vX.Y or vX.Y.Z builds release X.Y[.Z] (identity FM-1_39XXYYZZ, native/build.sh); a release published on
# github.com (its tag made by publishing it) is filled once. workflow_dispatch builds a dev package as an artifact only.
name: Build and attest firmware

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miku-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Prepare a draft (or fill a fresh github.com release) without replacing packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Miku-FM
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then exit 0; fi
          version=${GITHUB_REF_NAME#v}
          # (the versions native/build.sh --release takes)
          [[ "$version" =~ ^[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]{1,2})?(-[A-Za-z0-9]+)?$ ]]
          flags=(--prerelease=false)
          if [[ "$version" == *-* ]]; then flags=(--prerelease --latest=false); fi
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft); then
            # refuse only a release that already has packages
            n=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '[.assets[].name | select(endswith(".fwsc"))] | length')
            [[ "$n" == 0 ]] || { echo 'Refusing to rebuild a release that has packages'; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "$TITLE $version" --generate-notes "${flags[@]}"
          fi

  firmware:
    needs: prepare
    # The Firmware Hub recognises attestations from this reviewed builder tag.
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      sdk: true
      tests-block: true
      build: |
        set -euo pipefail
        test "$(git -C "$AC79_SDK" rev-parse HEAD)" = d179b4484759423312073f5fbb232501aa491047
        mkdir -p build/release-assets
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          version=${GITHUB_REF_NAME#v}
          bash native/build.sh --release "$version"
          cp "build/native/miku-fm-$version.fwsc" "build/native/miku-fm-$version-app.bin" build/release-assets/
        else
          bash native/build.sh
          cp build/native/miku-fm.fwsc build/native/miku-fm-app.bin build/release-assets/
        fi
      test: |
        set -euo pipefail
        python3 -m venv build/validation-venv
        build/validation-venv/bin/python -m pip install -r tools/requirements-dev.txt
        cmake -S . -B build/host -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE="$PWD/build/validation-venv/bin/python"
        cmake --build build/host --parallel
        ctest --test-dir build/host --output-on-failure
      packages: build/release-assets/*

  verify:
    needs: firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: build/attested
      - name: Verify checksums and signed source provenance
        working-directory: build/attested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          for package in build/release-assets/*.fwsc build/release-assets/*-app.bin; do
            gh attestation verify "$package" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow zvenson/fm1-build/.github/workflows/build.yml \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA"
          done
      - name: Publish the verified draft
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
